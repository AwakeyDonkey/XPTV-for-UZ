name: Sync XPTV and publish UZ subscription

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'sources.json'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/sync-and-release.yml'

permissions:
  contents: write

concurrency:
  group: xptv-sync-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync, verify, and package
        run: |
          npm run audit:upstream
          npm run build
      - name: Save refreshed source snapshot
        run: |
          if ! git diff --quiet -- sources.json local.json vod/js; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -- sources.json local.json vod/js
            git commit -m "chore: sync XPTV sources [skip ci]"
            git push
          fi
      - name: Publish stable subscription asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view uz-latest >/dev/null 2>&1; then
            gh release upload uz-latest dist/XPTV-for-UZ.zip --clobber
          else
            gh release create uz-latest dist/XPTV-for-UZ.zip --title "UZ latest subscription" --notes "Automatically synchronized XPTV-to-UZ compatibility package."
          fi
